name: Feature request
description: Suggest an improvement to this external community project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem and expected value. Do not include customer data, credentials, or private server information.
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: I understand this is an independent project and not an official Chatwoot feature request.
          required: true
        - label: I searched existing issues for similar requests.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the real-world need using fictional data.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Database, privacy, and compatibility impact
      description: Explain any effect on PostgreSQL, Chatwoot schema compatibility, or user data.
    validations:
      required: true
